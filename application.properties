spring.application.name=student-profile-management
server.port=8081

# Create this database once in MySQL: CREATE DATABASE student_skill_db;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_skill_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
